<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Identidad -->
    <title>Capital One Business — Flujo de efectivo para microempresas</title>
    <meta name="application-name" content="Capital One Business" />
    <meta
      name="description"
      content="Gestión de flujo de efectivo para microempresas: construye liquidez y aprende finanzas sobre la marcha. La mayoría de los microempresarios nunca recibió formación financiera; esta app la pone en su día a día."
    />

    <!-- PWA / móvil -->
    <meta name="theme-color" content="#13294b" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="C1 Business" />

    <!-- Iconos -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="mask-icon" href="./favicon.svg" color="#13294b" />

    <!-- Open Graph (WhatsApp, Slack, LinkedIn, Devpost) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capital One Business" />
    <meta property="og:locale" content="es_MX" />
    <meta
      property="og:title"
      content="Capital One Business — Flujo de efectivo para microempresas"
    />
    <meta
      property="og:description"
      content="Construye liquidez y aprende finanzas sobre la marcha. La mayoría de los microempresarios nunca recibió formación financiera; esta app la pone en su día a día."
    />
    <!-- OJO: para que las previews funcionen al compartir el link, og:image y
         og:url tienen que ser URLs ABSOLUTAS del sitio desplegado. Se llenan
         despues del deploy — ver docs/DEPLOY.md. -->
    <meta property="og:image" content="./pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Capital One Business" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Capital One Business — Flujo de efectivo para microempresas"
    />
    <meta
      name="twitter:description"
      content="Construye liquidez y aprende finanzas sobre la marcha, para negocios que nunca recibieron formación financiera."
    />
    <meta name="twitter:image" content="./pwa-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
