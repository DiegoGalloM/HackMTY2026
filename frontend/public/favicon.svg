<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Capital One">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13294b" />
      <stop offset="1" stop-color="#0b1a33" />
    </linearGradient>
    <!-- Swoosh: elipse exterior menos la interior, corrida a la izquierda y
         un poco más chica. La diferencia queda gruesa a la derecha y en punta
         a la izquierda. Sin rotar: a 16px no se nota y evita que la máscara y
         la elipse queden en espacios de coordenadas distintos. -->
    <mask id="swoosh">
      <rect width="64" height="64" fill="white" />
      <ellipse cx="29.98" cy="32" rx="25.11" ry="10.23" fill="black" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <ellipse cx="32" cy="32" rx="27" ry="11" fill="#ee4b3b" mask="url(#swoosh)" />
</svg>
